[project]
name = "ttw-pipelines"
version = "0.1.0"
description = "Data pipelines for Taipei Tree Watch: protected-tree sync, delisting records, inventory diff, snapshot backup"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pyproj>=3.7",
    "pypdf>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
