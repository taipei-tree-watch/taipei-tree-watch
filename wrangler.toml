name = "taipei-tree-watch"
main = "worker/src/index.ts"
compatibility_date = "2026-08-22"

# Static frontend built by `npm run build`. Requests matching run_worker_first
# reach the Worker; everything else is served straight from the assets.
assets = { directory = "web/dist", binding = "ASSETS", run_worker_first = ["/api/*"] }

[[d1_databases]]
binding = "DB"
database_name = "taipei-tree-watch"
database_id = "a6deb847-27c8-494f-8721-04accfd1b911"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "a46890929ba843c2810a54e1865637e6"

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[vars]
# Public Turnstile site key. The frontend build reads it from here through
# scripts/wrangler-vars.ts, so this file is the single source. The matching
# secret key is set with `wrangler secret put TURNSTILE_SECRET_KEY`.
TURNSTILE_SITE_KEY = "0x4AAAAAAE9dYsoPZcxqgf-E"
# Hostname the Turnstile widget is served from. siteverify reports the page
# that served the widget, so this rejects a token farmed from a copy of the
# form hosted elsewhere. An empty value turns the comparison off, which is
# what local `wrangler dev` and the test suite rely on.
TURNSTILE_HOSTNAME = "taipei-tree-watch.taipeitreewatch.workers.dev"
# Accepted report coordinates: minLng,minLat,maxLng,maxLat (WGS84).
# Taipei City plus roughly two kilometres, so a report aimed from a
# boundary street is still accepted. See SPEC section 2.
BBOX = "121.43,24.94,121.68,25.24"
