name = "taipei-tree-watch"
main = "worker/src/index.ts"
compatibility_date = "2026-08-22"

# Static frontend built by `npm run build`. Requests matching run_worker_first
# reach the Worker; everything else is served straight from the assets.
assets = { directory = "web/dist", binding = "ASSETS", run_worker_first = ["/api/*"] }

[[d1_databases]]
binding = "DB"
database_name = "taipei-tree-watch"
# Placeholder. Replace with the id printed by `wrangler d1 create taipei-tree-watch`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SNAPSHOTS"
# Placeholder. Replace with the id printed by `wrangler kv namespace create SNAPSHOTS`.
id = "0000000000000000000000000000dead"

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[vars]
# Placeholder. Replace with the public site key from the Turnstile dashboard.
# The matching secret key is set with `wrangler secret put TURNSTILE_SECRET_KEY`.
TURNSTILE_SITE_KEY = "0x0000000000000000000000AA"
# Accepted report coordinates: minLng,minLat,maxLng,maxLat (WGS84).
BBOX = "121.30,24.85,121.75,25.35"
