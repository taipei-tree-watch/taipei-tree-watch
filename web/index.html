<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Taipei Tree Watch</title>
  </head>
  <body>
    <div id="map" class="map"></div>

    <header class="topbar">
      <span id="brand" class="brand"></span>
      <nav class="topbar-actions">
        <button id="filters-toggle" type="button" class="chip" aria-expanded="false"></button>
        <button id="info-toggle" type="button" class="chip" aria-expanded="false"></button>
        <button id="report-toggle" type="button" class="chip chip-primary" aria-expanded="false"></button>
      </nav>
    </header>

    <div class="map-controls">
      <button id="ortho-toggle" type="button" class="map-control" aria-pressed="false"></button>
      <button id="locate-map" type="button" class="map-control"></button>
    </div>

    <div id="status-bar" class="status-bar" role="status" hidden></div>

    <aside id="filter-panel" class="panel panel-filters" aria-label="filters" hidden></aside>
    <aside id="info-panel" class="panel panel-info" aria-label="information" hidden></aside>
    <aside id="mine-panel" class="panel panel-mine" aria-label="my reports" hidden></aside>
    <div id="detail-card" class="card" role="dialog" aria-label="detail" hidden></div>
    <section id="report-sheet" class="sheet" aria-hidden="true" hidden></section>

    <noscript>
      <p class="noscript">這個網站的地圖、說明與安全警語都需要 JavaScript 才會顯示。</p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
