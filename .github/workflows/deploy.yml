name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

# Deploys run to completion in order; a newer deploy must not cancel an
# in-flight one and leave the Worker half-updated.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Check out the exact commit that CI validated, not the current head of main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # wrangler.toml at the repo root uploads the Worker and web/dist together.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
