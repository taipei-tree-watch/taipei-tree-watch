name: pipeline-protected-trees

on:
  schedule:
    # Mondays 02:00 UTC (10:00 Taipei)
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: pipeline-protected-trees

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --directory pipelines

      - run: uv run --directory pipelines ttw-pipelines protected-trees

      - name: Commit and push dataset changes
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add -A data/protected-trees
          if git diff --cached --quiet; then
            echo "protected-tree dataset unchanged"
            exit 0
          fi
          git commit -m "Update protected-tree dataset"
          git push origin HEAD:main
